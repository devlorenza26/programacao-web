<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Campo Minado</title>
</head>
<body bgcolor="#f4f4f4">

    <!-- Título Principal -->
    <h1>Campo Minado</h1>
    <p>Projeto de Programação Web</p>
    <hr>

    <!-- Formulário de Configurações -->
    <h2>Configurações do Jogo</h2>
    <form>
        <p>
            <label>Nome do Jogador:</label><br>
            <input type="text" id="nome" placeholder="Digite seu nome">
        </p>

        <p>
            <label>Linhas:</label>
            <input type="number" id="linhas" value="5">
            
            <label>Colunas:</label>
            <input type="number" id="colunas" value="6">
        </p>

        <p>
            <label>Número de Bombas:</label>
            <input type="number" id="bombas" value="3">
        </p>

        <p>
            <label>Modo de Jogo:</label>
            <select id="modo">
                <option value="classico">Clássico</option>
                <option value="rivotril">Rivotril (Com Tempo)</option>
            </select>
        </p>

        <p>
            <button type="button">Iniciar Jogo</button>
        </p>
    </form>

    <hr>

    <!-- Área do Tabuleiro -->
    <h2>Tabuleiro</h2>
    <p><b>Tempo:</b> <span id="cronometro">00:00</span></p>
    
    <p>
        <button type="button" id="btn-trapaca">Botão Trapaça</button>
    </p>

    <!-- Div onde o tabuleiro vai aparecer depois com o JS -->
    <div id="tabuleiro">
        <p>O tabuleiro vai aparecer aqui quando o jogo começar.</p>
    </div>

    <hr>

    <!-- Tabela do Histórico -->
    <h2>Histórico de Partidas</h2>
    <table border="1" width="100%">
        <thead>
            <tr>
                <th>Jogador</th>
                <th>Grid</th>
                <th>Bombas</th>
                <th>Modo</th>
                <th>Tempo</th>
                <th>Resultado</th>
                <th>Data/Hora</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="7" align="center">Nenhuma partida registrada ainda.</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
